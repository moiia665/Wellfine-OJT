<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>충전파트 OJT 교육</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --surface:#1a1e2e; --surface2:#222740;
  --accent:#f5a623; --accent2:#e05c2c;
  --green:#3dd68c; --red:#ff4d4d; --blue:#4fc3f7;
  --text:#e8eaf2; --muted:#7a7f9a; --border:#2d3250; --card:#1e2235;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:999;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s ease;overflow:hidden}
#splash::after{content:'';position:absolute;inset:0;width:100%;height:100%;background:url('wellfine_bg.png') center center/300% no-repeat;opacity:.9;pointer-events:none;z-index:0}
#splash>*{position:relative;z-index:1}
#splash.hidden{opacity:0;pointer-events:none}
.logo-mark{width:80px;height:80px;border:3px solid #d4830a;border-radius:20px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:#d4830a;cursor:pointer;animation:pulse 1.8s ease infinite;transition:transform .15s ease}
.logo-mark:active{transform:scale(.92)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,100,0,.4)}50%{box-shadow:0 0 0 20px rgba(180,100,0,0)}}
#splash h1{font-size:20px;font-weight:900;letter-spacing:-.5px;color:#1a1e2e}
#splash p{font-size:14px;color:#3a7d55;font-weight:700;letter-spacing:-.3px}
.splash-hint{font-size:12px;color:#c07a10;animation:blink 2s ease infinite;margin-top:-6px}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

/* PART SELECT SHEET */
#part-sheet{position:fixed;inset:0;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:flex-end;background:rgba(0,0,0,.65);backdrop-filter:blur(6px)}
.sheet-box{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:28px 20px 48px;display:flex;flex-direction:column;gap:12px;animation:sheetUp .3s ease}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:1px;text-align:center;margin-bottom:6px}
.sheet-card{display:flex;align-items:center;gap:16px;border-radius:16px;padding:18px 16px;cursor:pointer;transition:transform .15s,border-color .2s;border:1.5px solid var(--border);background:var(--card)}
.sheet-card:active{transform:scale(.97)}
.sheet-card.s-bae{border-color:rgba(245,166,35,.4)}
.sheet-card.s-chung{border-color:rgba(79,195,247,.3)}
.sheet-card.s-coming{opacity:.45;cursor:default}
.sheet-card.s-coming:active{transform:none}
.sc-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.s-bae .sc-icon{background:rgba(245,166,35,.12)}
.s-chung .sc-icon{background:rgba(79,195,247,.1)}
.sc-info{flex:1}
.sc-info h3{font-size:16px;font-weight:900}
.sc-info p{font-size:12px;color:var(--muted);margin-top:3px}
.sc-badge{display:inline-block;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px}
.s-bae .sc-badge{background:rgba(245,166,35,.1);color:var(--accent)}
.s-chung .sc-badge{background:rgba(79,195,247,.1);color:var(--blue)}
.sc-arrow{font-size:20px;color:var(--muted)}
.sheet-cancel{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:12px;padding:14px;width:100%;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:4px}

/* HOME */
#home-screen{display:none;flex-direction:column;min-height:100vh;padding-bottom:60px}
.home-hero{padding:32px 20px 24px;border-bottom:1px solid var(--border);background:linear-gradient(160deg,var(--surface) 0%,var(--bg) 100%)}
.ojt-badge{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--accent);background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);padding:4px 10px;border-radius:20px;margin-bottom:14px}
.home-hero h1{font-size:24px;font-weight:900;line-height:1.3;letter-spacing:-.5px}
.home-hero h1 span{color:var(--accent)}
.home-hero p{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}
.home-stats{display:flex;gap:10px;margin-top:20px}
.stat-chip{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:center}
.stat-chip .s-num{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--accent)}
.stat-chip .s-label{font-size:10px;color:var(--muted);margin-top:2px}
.part-section{padding:20px 16px 0}
.part-section>h2{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-bottom:12px}
.part-card{background:var(--card);border:1.5px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;margin-bottom:12px;transition:transform .15s}
.part-card:active{transform:scale(.98)}
.part-card-body{padding:20px 18px;display:flex;align-items:center;gap:16px}
.part-icon{width:52px;height:52px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.part-info{flex:1}
.part-info h3{font-size:17px;font-weight:900;letter-spacing:-.3px}
.part-info p{font-size:12px;color:var(--muted);margin-top:4px}
.part-count{display:inline-block;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px}
.part-arrow{font-size:20px;color:var(--muted)}
.h-bae{border-color:rgba(245,166,35,.35)}
.h-bae .part-icon{background:rgba(245,166,35,.12)}
.h-bae .part-count{background:rgba(245,166,35,.1);color:var(--accent)}
.h-chung{border-color:rgba(79,195,247,.3)}
.h-chung .part-icon{background:rgba(79,195,247,.1)}
.h-chung .part-count{background:rgba(79,195,247,.1);color:var(--blue)}
.h-coming{opacity:.5;cursor:default}
.h-coming:active{transform:none}
.coming-tag{margin:0 18px 14px;font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;display:inline-block}
.home-progress-wrap{padding:16px}
.home-progress-box{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:16px}
.home-progress-box h3{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:12px;letter-spacing:.5px}
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prog-row:last-child{margin-bottom:0}
.prog-label{font-size:12px;font-weight:700;width:50px;flex-shrink:0}
.prog-bar{flex:1;height:6px;background:var(--border);border-radius:6px;overflow:hidden}
.prog-fill{height:100%;border-radius:6px;transition:width .5s ease}
.fill-bae{background:var(--accent)}
.fill-chung{background:var(--blue)}
.prog-pct{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;width:32px;text-align:right;flex-shrink:0}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(15,17,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 20px;display:none;align-items:center;gap:12px}
header h1{font-size:15px;font-weight:700;flex:1}
.back-home-btn{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--text);flex-shrink:0}
.progress-ring{width:36px;height:36px;position:relative;flex-shrink:0}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.ring-bg{stroke:var(--border)}
.ring-fg{stroke:var(--green);transition:stroke-dashoffset .5s ease}
.progress-ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--green)}

/* MODULE LIST */
#module-list{padding:16px 16px 100px;display:none;flex-direction:column;gap:10px}
.module-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .2s;animation:fadeUp .3s ease backwards}
.module-card:active{transform:scale(.98)}
.module-card.completed{border-color:rgba(61,214,140,.3)}
.card-header{display:flex;align-items:center;gap:12px;padding:14px 16px}
.module-num{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.module-card.completed .module-num{background:rgba(61,214,140,.1);color:var(--green);border-color:rgba(61,214,140,.3)}
.card-info{flex:1}
.card-info h3{font-size:14px;font-weight:700;line-height:1.3}
.card-info p{font-size:11px;color:var(--muted);margin-top:2px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
.module-card.completed .status-dot{background:var(--green);box-shadow:0 0 6px var(--green)}
@keyframes fadeUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

/* MODULE DETAIL */
#module-detail{display:none;min-height:100vh;padding-bottom:100px}
.detail-header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;gap:14px}
.back-btn{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:var(--text);flex-shrink:0}
.detail-header h2{font-size:15px;font-weight:700;flex:1;line-height:1.3}
.module-tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25);padding:2px 7px;border-radius:5px;white-space:nowrap}

/* TABS */
.tab-nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:12px 4px;font-size:12px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab-btn .tab-icon{font-size:16px}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn.done{color:var(--green)}
.tab-panel{display:none;padding:20px 16px}
.tab-panel.active{display:block}

/* EXPLAIN TAB */
.explain-box{background:var(--surface2);border:2px dashed var(--accent);border-radius:14px}
.explain-label{padding:10px 16px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--accent);background:rgba(245,166,35,.1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.img-ph-logo{width:100%;aspect-ratio:4/1;background:var(--surface);border:2px dashed var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);margin-top:14px}
.hint-box{background:rgba(224,92,44,.08);border:1px solid rgba(224,92,44,.25);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;margin-top:14px;display:flex;gap:10px}
.hint-icon{font-size:18px;flex-shrink:0}

/* QUIZ TAB */
.quiz-wrapper{display:flex;flex-direction:column;gap:16px}
.question-box{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:18px 16px}
.question-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--accent2);margin-bottom:10px;text-transform:uppercase}
.question-text{font-size:15px;font-weight:700;line-height:1.6}
.options{display:flex;flex-direction:column;gap:8px}
.option-btn{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;font-size:14px;color:var(--text);transition:all .2s;text-align:left;font-family:'Noto Sans KR',sans-serif;width:100%}
.option-btn:active:not(:disabled){transform:scale(.98)}
.option-num{width:26px;height:26px;border-radius:7px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
.option-btn.correct{border-color:var(--green);background:rgba(61,214,140,.07)}
.option-btn.correct .option-num{background:var(--green);color:#000;border-color:var(--green)}
.option-btn.wrong{border-color:var(--red);background:rgba(255,77,77,.07)}
.option-btn.wrong .option-num{background:var(--red);color:#fff;border-color:var(--red)}
.option-btn:disabled{cursor:default}
.result-banner{border-radius:12px;padding:14px 16px;display:none;align-items:center;gap:12px;font-size:14px;font-weight:700}
.result-banner.show{display:flex}
.correct-banner{background:rgba(61,214,140,.1);border:1px solid rgba(61,214,140,.3);color:var(--green)}
.wrong-banner{background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.3);color:var(--red)}
.r-icon{font-size:22px}
.next-tab-btn{background:var(--accent);color:#000;border:none;border-radius:12px;padding:16px;width:100%;font-size:15px;font-weight:900;cursor:pointer;display:none;transition:opacity .2s;font-family:'Noto Sans KR',sans-serif}
.next-tab-btn:active{opacity:.8}
.next-tab-btn.show{display:block}

/* VIDEO TAB */
.video-wrapper{background:var(--surface2);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;text-align:center}
.video-label{padding:10px 16px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--green);background:rgba(61,214,140,.07);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.video-inner{width:100%;aspect-ratio:9/16;background:#000;display:flex;align-items:center;justify-content:center;margin:0 auto}
.video-inner video{width:100%;height:100%;object-fit:cover;display:block}
.video-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);width:100%}
.play-icon{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.06);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:22px}
.video-ph p{font-size:12px;text-align:center;line-height:1.6;padding:0 20px}
.video-desc{padding:14px 16px;font-size:13px;line-height:1.7;color:var(--muted);border-top:1px solid var(--border);text-align:left}
.complete-btn{background:linear-gradient(135deg,var(--green),#27b578);color:#000;border:none;border-radius:12px;padding:16px;width:100%;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Noto Sans KR',sans-serif}
.complete-btn:active{opacity:.85}
.complete-btn.done{background:var(--surface2);color:var(--green);border:1px solid rgba(61,214,140,.3);cursor:default}

/* BOTTOM BAR */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,23,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:10px 20px 16px;display:none;flex-direction:column;gap:6px;z-index:80}
.bottom-info{display:flex;justify-content:space-between;align-items:center}
.bottom-info span{font-size:11px;color:var(--muted)}
.bottom-info strong{font-size:11px;color:var(--green)}
.prog-bar-outer{height:4px;background:var(--border);border-radius:4px;overflow:hidden}
.prog-bar-inner{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:4px;transition:width .5s ease}

/* COMPLETE */
#complete-screen{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:40px 24px;text-align:center}
.trophy{font-size:72px;margin-bottom:8px}
#complete-screen h2{font-size:26px;font-weight:900}
#complete-screen p{font-size:14px;color:var(--muted);line-height:1.7}
.home-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:14px 28px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;font-family:'Noto Sans KR',sans-serif}

.confetti{position:fixed;pointer-events:none;z-index:9999}

  .lang-bar{display:flex;gap:10px;justify-content:center;margin-bottom:-8px}
  .lang-btn{padding:6px 20px;border-radius:20px;border:2px solid;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;background:transparent}
  .lang-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .lang-btn.inactive{color:var(--accent);border-color:var(--accent)}
  .lang-btn.inactive:hover{background:var(--accent);color:#fff}

.cat-chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle;letter-spacing:.3px}
.cat-근태{background:#7a4200;color:#f5a623}
.cat-회사이해{background:#1a6b3e;color:#3dd68c}
.cat-공정이해도{background:#0d4a7a;color:#4fc3f7}
.cat-설비운전{background:#7a2b00;color:#ff7043}
.cat-CIP{background:#4a1875;color:#ab47bc}
.cat-이상대응{background:#7a0000;color:#ef5350}
.cat-divider{padding:12px 16px 4px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;border-top:1px solid var(--border);margin-top:4px}
.cat-divider:first-child{border-top:none;margin-top:0}
.explanation-box{background:rgba(61,214,140,.06);border:1px solid rgba(61,214,140,.3);border-radius:12px;padding:16px;margin:14px 0 8px;display:none}
.explanation-box.show{display:block}
.explanation-box .ex-label{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px;letter-spacing:.5px}
.explanation-box .ex-text{font-size:14px;color:var(--text);line-height:1.7}
</style>
</head>
<body>

<!-- HEADER -->
<header style="position:sticky;top:0;z-index:100;background:rgba(15,17,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px">
  <button onclick="location.href='index.html'" style="background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif">← 홈</button>
  <h1 style="font-size:16px;font-weight:700;flex:1">충전 파트 (31개 모듈)</h1>
</header>

<!-- MODULE LIST -->
<div id="module-list" style="padding:20px 16px;display:flex;flex-direction:column;gap:12px"></div>

<!-- MODULE DETAIL -->
<div id="module-detail" style="display:none;min-height:100vh">
  <div style="position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 20px">
    <button onclick="goBack()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif">← 뒤로</button>
  </div>
  
  <div style="padding:20px">
    <div style="font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:6px" id="detail-tag"></div>
    <h2 id="detail-title" style="font-size:22px;font-weight:900;margin-bottom:20px"></h2>
    
    <!-- TABS -->
    <div style="display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid var(--border)" id="tab-container">
      <button class="tab-btn active" id="tab-explain" onclick="switchTab('explain')">📖 설명</button>
      <button class="tab-btn" id="tab-quiz" onclick="switchTab('quiz')">✏️ 문제</button>
      <button class="tab-btn" id="tab-video" onclick="switchTab('video')" style="display:none">▶️ 영상</button>
    </div>
    
    <!-- EXPLAIN PANEL -->
    <div id="panel-explain" class="panel active">
      <div id="explain-img-inner" style="background:var(--surface);border-radius:12px;overflow:hidden;margin-bottom:16px"></div>
      <button onclick="switchTab('quiz')" style="background:var(--accent);color:#000;border:none;border-radius:12px;padding:16px;width:100%;font-size:15px;font-weight:900;cursor:pointer;font-family:'Noto Sans KR',sans-serif">문제 풀기 →</button>
    </div>

const getDone = () => JSON.parse(localStorage.getItem('ojt_chung') || '[]');
const saveDone = (arr) => localStorage.setItem('ojt_chung', JSON.stringify(arr));

let curModule = null;
let quizDone = false;

function renderList() {
  const done = getDone();
  const el = document.getElementById('module-list');
  el.innerHTML = '';
  
  let lastCat = null;
  MODULES.forEach(m => {
    if (m.category !== lastCat) {
      const sep = document.createElement('div');
      sep.className = 'cat-divider';
      sep.textContent = '▸ ' + m.category;
      el.appendChild(sep);
      lastCat = m.category;
    }
    
    const d = document.createElement('div');
    d.className = 'module-card' + (done.includes(m.id) ? ' completed' : '');
    d.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:36px;height:36px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700">${String(m.id).padStart(2,'0')}</div>
        <div style="flex:1">
          <div style="font-size:15px;font-weight:700">${m.title}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${m.category}</div>
        </div>
        <div style="width:12px;height:12px;border-radius:50%;background:${done.includes(m.id) ? 'var(--green)' : 'var(--border)'}"></div>
      </div>
    `;
    d.onclick = () => openModule(m);
    el.appendChild(d);
  });
}

function openModule(m) {
  curModule = m;
  quizDone = false;
  
  document.getElementById('module-list').style.display = 'none';
  document.getElementById('module-detail').style.display = 'block';
  document.querySelector('header').style.display = 'none';
  
  document.getElementById('detail-tag').textContent = 'MODULE ' + String(m.id).padStart(2,'0');
  document.getElementById('detail-title').textContent = m.title;
  
  // 동영상 탭 표시/숨김
  const videoTab = document.getElementById('tab-video');
  if (m.hasVideo) {
    videoTab.style.display = 'block';
  } else {
    videoTab.style.display = 'none';
  }
  
  // 이미지
  const imgPath = 'chung_' + String(m.id).padStart(2,'0') + '_explain.jpg';
  document.getElementById('explain-img-inner').innerHTML = 
    '<img src="' + imgPath + '" style="width:100%;height:auto;display:block" onerror="this.parentElement.innerHTML=\'<div style=\\\'padding:40px;text-align:center\\\'><span style=\\\'font-size:48px\\\'>📷</span><div style=\\\'margin-top:12px;font-size:13px\\\'>이미지 추가 예정</div><div style=\\\'font-size:11px;font-family:JetBrains Mono,monospace;margin-top:4px\\\'>' + imgPath + '</div>\'">';
  
  // 퀴즈
  document.getElementById('quiz-question').textContent = m.question;
  const opts = document.getElementById('quiz-options');
  opts.innerHTML = '';
  m.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'option-btn';
    b.innerHTML = '<span class="option-num">' + (i+1) + '</span><span>' + o + '</span>';
    b.onclick = () => answer(i, m.answer);
    opts.appendChild(b);
  });
  
  document.getElementById('result-banner').className = 'result-banner';
  document.getElementById('explanation-box').className = 'explanation-box';
  
  const done = getDone().includes(m.id);
  const cb = document.getElementById('complete-btn');
  cb.textContent = done ? '✅ 완료된 모듈' : '✅ 이 모듈 완료하기';
  cb.style.opacity = done ? '0.5' : '1';
  
  switchTab('explain');
  window.scrollTo(0, 0);
}

function switchTab(t) {
  ['explain','quiz','video'].forEach(n => {
    const p = document.getElementById('panel-'+n);
    const tb = document.getElementById('tab-'+n);
    if (p) p.classList.toggle('active', n===t);
    if (tb) tb.classList.toggle('active', n===t);
  });
  if (t==='quiz' && quizDone) document.getElementById('tab-quiz').classList.add('done');
}

function answer(chosen, correct) {
  if (quizDone) return;
  quizDone = true;
  
  document.querySelectorAll('.option-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === correct) b.classList.add('correct');
    if (i === chosen && chosen !== correct) b.classList.add('wrong');
  });
  
  const ok = chosen === correct;
  const banner = document.getElementById('result-banner');
  banner.className = 'result-banner show ' + (ok ? 'correct-banner' : 'wrong-banner');
  banner.innerHTML = '<div style="font-size:32px;margin-bottom:8px">' + (ok ? '🎉' : '❌') + '</div><div style="font-size:15px;font-weight:700">' + (ok ? '정답입니다!' : '오답입니다. 정답은 ' + (correct+1) + '번입니다.') + '</div>';
  
  document.getElementById('explanation-text').textContent = curModule.explanation;
  document.getElementById('explanation-box').className = 'explanation-box show';
  document.getElementById('tab-quiz').classList.add('done');
}

function completeModule() {
  if (!curModule) return;
  let done = getDone();
  if (!done.includes(curModule.id)) {
    done.push(curModule.id);
    saveDone(done);
  }
  goBack();
}

function goBack() {
  document.getElementById('module-detail').style.display = 'none';
  document.getElementById('module-list').style.display = 'flex';
  document.querySelector('header').style.display = 'flex';
  renderList();
  window.scrollTo(0, 0);
}

// 초기화
renderList();
</script>
