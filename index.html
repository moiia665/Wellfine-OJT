<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>웰파인 생산팀 OJT 교육</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --surface:#1a1e2e; --accent:#f5a623; --green:#3dd68c; --blue:#4fc3f7;
  --text:#e8eaf2; --muted:#7a7f9a; --border:#2d3250;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  background-image:url('wellfine_bg.png');
  background-size:contain;
  background-position:center center;
  background-repeat:no-repeat;
  background-attachment:fixed;
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:rgba(15,17,23,0.85);
  z-index:-1;
}
.container{max-width:500px;width:100%}
.logo{text-align:center;margin-bottom:40px}
.logo-img{width:200px;margin-bottom:20px}
h1{font-size:28px;font-weight:900;text-align:center;margin-bottom:10px}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:50px}
.part-grid{display:grid;gap:16px;margin-bottom:30px}
.part-card{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:24px;cursor:pointer;transition:all .2s}
.part-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.part-card:active{transform:scale(.98)}
.part-header{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.part-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.bae-card .part-icon{background:rgba(245,166,35,.1)}
.chung-card .part-icon{background:rgba(79,195,247,.1)}
.part-title{font-size:20px;font-weight:900}
.part-desc{color:var(--muted);font-size:13px;line-height:1.6}
.lang-selector{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.lang-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif}
.lang-btn:hover{background:rgba(255,255,255,.1);border-color:var(--accent)}
.lang-btn.kr{color:var(--accent)}
.lang-btn.np{color:var(--blue)}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <img src="wellfine_logo.jpg" alt="Wellfine" class="logo-img" onerror="this.style.display='none'">
    <h1>생산팀 신입 OJT 교육</h1>
    <p class="subtitle">파트와 언어를 선택하세요</p>
  </div>

  <div class="part-grid">
    <!-- 배합파트 -->
    <div class="part-card bae-card">
      <div class="part-header">
        <div class="part-icon">🧪</div>
        <div class="part-title">배합 파트</div>
      </div>
      <p class="part-desc">밸브 조작, CIP 위생, 원료 계량 등<br>34개 교육 모듈</p>
      <div class="lang-selector">
        <button class="lang-btn kr" onclick="location.href='bae.html'">🇰🇷 한국어</button>
        <button class="lang-btn np" onclick="location.href='bae_np.html'">🇳🇵 नेपाली</button>
      </div>
    </div>

    <!-- 충전파트 -->
    <div class="part-card chung-card">
      <div class="part-header">
        <div class="part-icon">💧</div>
        <div class="part-title">충전 파트</div>
      </div>
      <p class="part-desc">스틱 충전, 봉합, 검사 공정 등<br>31개 교육 모듈</p>
      <div class="lang-selector">
        <button class="lang-btn kr" onclick="location.href='chung.html'">🇰🇷 한국어</button>
        <button class="lang-btn np" onclick="location.href='chung_np.html'">🇳🇵 नेपाली</button>
      </div>
    </div>
  </div>

  <div class="footer">
    © 2025 Wellfine. All rights reserved.
  </div>
</div>
</body>
</html>
