<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="theme-color" content="#ffffff">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>웰파인 생산팀 OJT 교육</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #7cb342;
  --primary-light: #aed581;
  --primary-dark: #558b2f;
  --accent: #ff6f00;
  --text-dark: #e8eaf2;
  --text-light: #7a7f9a;
  --border: #2d3250;
  --shadow: rgba(0,0,0,0.1);
  --bg: #0f1117;
  --surface: #1a1e2e;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-dark);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(15,17,23,0.85);
  z-index: -1;
}

/* ===== 스플래시 화면 ===== */
#splash-screen {
  position: fixed;
  inset: 0;
  background: #92C83D;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 1;
  transition: opacity 0.6s ease;
}

#splash-screen.fade-out {
  opacity: 0;
  pointer-events: none;
}

.splash-logo {
  width: 560px;
  max-width: 90vw;
  margin-bottom: 30px;
  animation: fadeInDown 0.8s ease;
}

.splash-title {
  font-family: 'Pretendard', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: #ffffff;
  text-align: center;
  animation: fadeInUp 0.8s ease 0.2s both;
  letter-spacing: -0.5px;
}

.splash-subtitle {
  font-size: 16px;
  color: rgba(255,255,255,0.8);
  margin-top: 10px;
  animation: fadeInUp 0.8s ease 0.4s both;
}

@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== 비밀번호 화면 ===== */
#password-screen {
  display: none;
  position: fixed;
  inset: 0;
  background: #92C83D;
  z-index: 9998;
  padding: 20px;
}

#password-screen.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.password-container {
  background: white;
  border-radius: 24px;
  padding: 50px 40px;
  box-shadow: 0 10px 40px var(--shadow);
  max-width: 420px;
  width: 100%;
  text-align: center;
}

.password-logo {
  width: 180px;
  margin-bottom: 30px;
}

.password-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--text-dark);
}

.password-desc {
  font-size: 14px;
  color: var(--text-light);
  margin-bottom: 35px;
}

.password-input-wrapper {
  position: relative;
  margin-bottom: 20px;
}

.password-input {
  width: 100%;
  padding: 16px 50px 16px 20px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 16px;
  font-family: 'Pretendard', sans-serif;
  transition: all 0.3s;
  background: #fafafa;
}

.password-input:focus {
  outline: none;
  border-color: var(--primary);
  background: white;
  box-shadow: 0 0 0 4px rgba(124, 179, 66, 0.1);
}

.password-toggle {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 20px;
  opacity: 0.5;
  transition: opacity 0.2s;
}

.password-toggle:hover {
  opacity: 1;
}

.password-submit {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  font-family: 'Pretendard', sans-serif;
  box-shadow: 0 4px 15px rgba(124, 179, 66, 0.3);
}

.password-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(124, 179, 66, 0.4);
}

.password-submit:active {
  transform: translateY(0);
}

.password-error {
  color: #e74c3c;
  font-size: 13px;
  margin-top: 10px;
  opacity: 0;
  transition: opacity 0.3s;
}

.password-error.show {
  opacity: 1;
}

/* ===== 메인 화면 ===== */
#main-screen {
  display: none;
  min-height: 100vh;
  padding: 20px;
  background: var(--bg);
}

#main-screen.active {
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.5s ease;
}

.container {
  max-width: 500px;
  width: 100%;
}

.main-header {
  text-align: center;
  margin-bottom: 50px;
}

.main-logo {
  width: 200px;
  margin-bottom: 25px;
}

h1 {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 10px;
  color: var(--text-dark);
}

.subtitle {
  color: var(--text-light);
  font-size: 15px;
}

.part-grid {
  display: grid;
  gap: 20px;
  margin-bottom: 30px;
}

.part-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 20px;
  padding: 30px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.part-card:hover {
  border-color: var(--primary);
  transform: translateY(-5px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

.part-card:active {
  transform: translateY(-2px);
}

.part-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 15px;
}

.part-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

.bae-card .part-icon {
  background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
}

.chung-card .part-icon {
  background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
}

.part-title {
  font-size: 22px;
  font-weight: 900;
  color: var(--text-dark);
}

.part-desc {
  color: var(--text-light);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 20px;
}

.lang-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.lang-btn {
  background: rgba(255,255,255,0.05);
  border: 2px solid var(--border);
  color: var(--text-dark);
  padding: 14px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  font-family: 'Pretendard', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.lang-btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(124,179,66,0.3);
}

.lang-btn:active {
  transform: translateY(0);
}

.footer {
  text-align: center;
  color: var(--text-light);
  font-size: 12px;
  margin-top: 50px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

/* 모바일 최적화 */
@media (max-width: 480px) {
  .password-container {
    padding: 40px 30px;
  }
  
  .splash-title {
    font-size: 20px;
  }
  
  h1 {
    font-size: 24px;
  }
  
  .part-card {
    padding: 25px;
  }
  
  .part-title {
    font-size: 20px;
  }
}
</style>
</head>
<body>

<!-- 스플래시 화면 -->
<div id="splash-screen">
  <img src="greenlogo.jpg" alt="Wellfine" class="splash-logo">
  <div class="splash-title">(주)웰파인 생산팀 OJT</div>
  <div class="splash-subtitle">Production Training System</div>
</div>

<!-- 비밀번호 화면 -->
<div id="password-screen">
  <div class="password-container">
    <img src="wellfine_logo.png" alt="Wellfine" class="password-logo">
    <h2 class="password-title">교육 시스템 접속</h2>
    <p class="password-desc">비밀번호를 입력하세요</p>
    
    <div class="password-input-wrapper">
      <input 
        type="password" 
        id="password-input" 
        class="password-input" 
        placeholder="비밀번호 입력"
        autocomplete="off"
      >
      <button class="password-toggle" onclick="togglePassword()">👁️</button>
    </div>
    
    <button class="password-submit" onclick="checkPassword()">로그인</button>
    <div class="password-error" id="password-error">비밀번호가 올바르지 않습니다</div>
  </div>
</div>

<!-- 메인 화면 -->
<div id="main-screen">
  <div class="container">
    <div class="main-header">
      <img src="wellfine_logo.png" alt="Wellfine" class="main-logo">
      <h1>생산팀 신입 OJT 교육</h1>
      <p class="subtitle">파트와 언어를 선택하세요</p>
    </div>

    <div class="part-grid">
      <!-- 배합파트 -->
      <div class="part-card bae-card">
        <div class="part-header">
          <div class="part-icon">🧪</div>
          <div class="part-title">배합 파트</div>
        </div>
        <p class="part-desc">밸브 조작, CIP 위생, 원료 계량 등<br>34개 교육 모듈</p>
        <div class="lang-selector">
          <button class="lang-btn kr" onclick="location.href='bae.html'">
            🇰🇷 한국어
          </button>
          <button class="lang-btn np" onclick="location.href='bae_np.html'">
            🇳🇵 नेपाली
          </button>
        </div>
      </div>

      <!-- 충전파트 -->
      <div class="part-card chung-card">
        <div class="part-header">
          <div class="part-icon">💧</div>
          <div class="part-title">충전 파트</div>
        </div>
        <p class="part-desc">스틱 충전, 봉합, 검사 공정 등<br>31개 교육 모듈</p>
        <div class="lang-selector">
          <button class="lang-btn kr" onclick="location.href='chung.html'">
            🇰🇷 한국어
          </button>
          <button class="lang-btn np" onclick="location.href='chung_np.html'">
            🇳🇵 नेपाली
          </button>
        </div>
      </div>
    </div>

    <div class="footer">
      © 2026 Wellfine. All rights reserved.
    </div>
  </div>
</div>

<script>
const CORRECT_PASSWORD = 'wellfine2026';
const AUTH_KEY = 'wellfine_auth';

// 페이지 로드 시 실행
window.addEventListener('load', () => {
  // 스플래시 화면 2.5초 후 사라짐
  setTimeout(() => {
    document.getElementById('splash-screen').classList.add('fade-out');
    
    setTimeout(() => {
      document.getElementById('splash-screen').style.display = 'none';
      
      // 인증 확인
      if (localStorage.getItem(AUTH_KEY) === 'true') {
        showMainScreen();
      } else {
        showPasswordScreen();
      }
    }, 600);
  }, 2500);

  // Enter 키로 로그인
  document.getElementById('password-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      checkPassword();
    }
  });
});

function showPasswordScreen() {
  document.getElementById('password-screen').classList.add('active');
  setTimeout(() => {
    document.getElementById('password-input').focus();
  }, 100);
}

function showMainScreen() {
  document.getElementById('password-screen').classList.remove('active');
  document.getElementById('main-screen').classList.add('active');
}

function togglePassword() {
  const input = document.getElementById('password-input');
  const toggle = document.querySelector('.password-toggle');
  
  if (input.type === 'password') {
    input.type = 'text';
    toggle.textContent = '🙈';
  } else {
    input.type = 'password';
    toggle.textContent = '👁️';
  }
}

function checkPassword() {
  const input = document.getElementById('password-input');
  const error = document.getElementById('password-error');
  const password = input.value.trim();
  
  if (password === CORRECT_PASSWORD) {
    // 인증 성공
    localStorage.setItem(AUTH_KEY, 'true');
    error.classList.remove('show');
    
    // 부드러운 전환
    document.getElementById('password-screen').style.opacity = '0';
    setTimeout(() => {
      showMainScreen();
    }, 300);
  } else {
    // 인증 실패
    error.classList.add('show');
    input.value = '';
    input.focus();
    
    // 입력창 흔들기 효과
    input.style.animation = 'shake 0.5s';
    setTimeout(() => {
      input.style.animation = '';
    }, 500);
  }
}

// 흔들기 애니메이션
const style = document.createElement('style');
style.textContent = `
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
    20%, 40%, 60%, 80% { transform: translateX(5px); }
  }
`;
document.head.appendChild(style);
</script>

</body>
</html>
